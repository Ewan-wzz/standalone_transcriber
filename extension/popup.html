<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线视频转写</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <h1>视频文案提取</h1>
          <p>本地离线识别 · 内容不上传</p>
        </div>
      </div>
      <span id="service-status" class="status checking">检查中</span>
    </header>

    <section class="action-card">
      <div class="page-hint">
        <span class="page-dot"></span>
        <div>
          <strong>当前小红书视频</strong>
          <small>保持视频页面打开，点击即可开始</small>
        </div>
      </div>
      <button id="start" type="button" disabled>
        <span class="start-icon" aria-hidden="true"></span>
        <span>提取视频文案</span>
      </button>
    </section>

    <section id="progress" class="progress-card idle">
      <span class="progress-icon" aria-hidden="true"></span>
      <div>
        <strong id="progress-title">准备就绪</strong>
        <p id="message" class="message">正在检查本地服务…</p>
      </div>
    </section>
    <p id="error" class="error" hidden></p>

    <section id="result" class="result-card" hidden>
      <div class="result-head">
        <div>
          <span>转写结果</span>
          <strong id="title">当前视频</strong>
        </div>
        <button id="copy" type="button" class="secondary">复制</button>
      </div>
      <textarea id="text" readonly></textarea>
      <small id="output-file" class="output-file"></small>
    </section>
    <footer>SenseVoice · 在你的电脑上完成识别</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
