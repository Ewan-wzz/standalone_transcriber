<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红书视频下载</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <h1>小红书视频下载</h1>
          <p>只负责下载 · 无需启动桌面程序</p>
        </div>
      </div>
      <span id="service-status" class="status ready">插件可用</span>
    </header>

    <section class="action-card">
      <div class="page-hint">
        <span class="page-dot"></span>
        <div>
          <strong>当前小红书视频</strong>
          <small>保存到“下载/小红书视频转写”文件夹</small>
        </div>
      </div>
      <button id="start" type="button">
        <span class="start-icon" aria-hidden="true"></span>
        <span>下载当前视频</span>
      </button>
    </section>

    <section id="progress" class="progress-card idle">
      <span class="progress-icon" aria-hidden="true"></span>
      <div>
        <strong id="progress-title">准备就绪</strong>
        <p id="message" class="message">打开小红书视频笔记后开始下载。</p>
      </div>
    </section>
    <p id="error" class="error" hidden></p>

    <section id="result" class="result-card" hidden>
      <div class="result-head">
        <div>
          <span>下载完成</span>
          <strong id="title">当前视频</strong>
        </div>
        <button id="show-download" type="button" class="secondary">在文件夹中显示</button>
      </div>
      <small id="output-file" class="output-file"></small>
    </section>
    <footer>下载完成后，请在桌面程序中手动转写</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
